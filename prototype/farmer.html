<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AnnSetu - Farmer Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
  <style>
    body { padding-top: 80px; font-family: 'Poppins', sans-serif; background: #fbf9f4; }
    .portal-card { background: white; border-radius: 20px; padding: 30px; box-shadow: 0 8px 25px rgba(0,0,0,0.08); margin-bottom: 25px; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark fixed-top" style="background: rgba(18,38,22,0.95)!important;">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">🌾 AnnSetu</a>
      <div class="ms-auto">
        <a href="index.html" class="btn btn-outline-light btn-sm rounded-pill px-3">Back to Home</a>
      </div>
    </div>
  </nav>

  <div class="container py-4">
    <div class="portal-card">
      <span class="badge bg-success mb-2 px-3 py-2">FARMER PORTAL</span>
      <h2 class="fw-bold text-success mb-1">Welcome, Annadata! 🌾</h2>
      <p class="text-muted">List your harvested produce and connect with buyers directly without middleman cuts.</p>
      <div class="row g-3 mt-2">
        <div class="col-md-4">
          <div class="p-3 bg-light rounded-4 text-center">
            <h4 class="fw-bold text-success">150+</h4>
            <div class="small text-muted">Connected Farmers</div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="p-3 bg-light rounded-4 text-center">
            <h4 class="fw-bold text-primary">0%</h4>
            <div class="small text-muted">Middlemen Commission</div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="p-3 bg-light rounded-4 text-center">
            <h4 class="fw-bold text-warning-emphasis">100%</h4>
            <div class="small text-muted">Direct Settlement</div>
          </div>
        </div>
      </div>
    </div>
  </div>

</html>
